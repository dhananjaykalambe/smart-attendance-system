<!DOCTYPE html>
<html>
<head>
<title>Change Password</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<button class="menu-toggle" onclick="toggleSidebar()">
    <div class="hamburger-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</button>

<!-- ✅ RIGHT HERE - Right after the button -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="sidebar" id="sidebar">
    <h2>👑 Admin Panel</h2>
    <a href="/admin_dashboard">📊 Dashboard</a>
    <a href="/admin/manage_faculty">👥 Manage Faculty</a>
    <a href="/admin/manage_students">👨‍🎓 Manage Students</a>
    <a href="/admin/manage_sessions">📊 Manage Sessions</a>
    <a href="/admin/system_settings">⚙️ System Settings</a>
    <a href="/admin/change_password">🔐 Change Password</a>
    <hr><a href="/logout">🚪 Logout</a>
</div>

<div class="main">
    <div class="header" style="background:linear-gradient(135deg,#dc3545,#c82333);">🔐 Change Admin Password</div>

    {% if message %}
    <div class="alert alert-success">{{ message }}</div>
    {% endif %}
    
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="card" style="max-width: 500px; margin: 0 auto;">
        <form method="POST">
            <div class="form-group"><label>Current Password:</label><input type="password" name="current_password" placeholder="Enter current password" required></div>
            <div class="form-group"><label>New Password:</label><input type="password" name="new_password" placeholder="New password (min 6 characters)" required></div>
            <div class="form-group"><label>Confirm New Password:</label><input type="password" name="confirm_password" placeholder="Confirm new password" required></div>
            <button type="submit">Update Password</button>
        </form>
        <p style="margin-top: 15px; font-size: 12px; color: #666; text-align: center;">🔒 For security, change your password regularly</p>
    </div>
</div>

<script>
    // Mobile Menu Functions
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const menuBtn = document.querySelector('.menu-toggle');
        if (sidebar) {
            sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
            if (menuBtn) menuBtn.classList.toggle('open');
        }
    }
    function closeSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const menuBtn = document.querySelector('.menu-toggle');
        if (sidebar) {
            sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
            if (menuBtn) menuBtn.classList.remove('open');
        }
    }
    document.querySelectorAll('.sidebar a').forEach(link => {
        link.addEventListener('click', () => { if (window.innerWidth <= 768) closeSidebar(); });
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && window.innerWidth <= 768) closeSidebar(); });
    window.addEventListener('resize', () => { if (window.innerWidth > 768) closeSidebar(); });
</script>
</body>

</html>
