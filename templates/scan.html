<!DOCTYPE html>
<html>
<head>
<title>Scan QR Code</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<button class="menu-toggle" onclick="toggleSidebar()">
    <div class="hamburger-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</button>

<!-- ✅ RIGHT HERE - Right after the button -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="sidebar" id="sidebar">
    <h2>📋 Smart Attendance</h2>
    <a href="/student_dashboard">📊 Dashboard</a>
    <a href="/scan">📷 Scan QR</a>
    <a href="/attendance">📜 My Attendance</a>
    <a href="/subject_details">📚 Subjects</a>
    <a href="/about">ℹ️ About</a>
    <a href="/logout">🚪 Logout</a>
</div>

<div class="main">
    <div class="header">
        📷 QR Code Scanner
    </div>

    <div class="card" style="text-align: center;">
        <h3>👋 Welcome, {{ name }}</h3>
        <p style="color: #666; margin-bottom: 20px;">Position the QR code within the frame to mark attendance</p>
        
        <div id="reader" style="width: 100%; max-width: 400px; margin: 20px auto;"></div>
        
        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee;">
            <form method="POST" action="/mark" id="attendanceForm">
                <input type="text" id="session_id" name="session_id" placeholder="Or enter Session ID manually" style="text-align: center;">
                <button type="submit">✅ Submit Attendance</button>
            </form>
        </div>
        
        <div id="locationStatus" style="margin-top: 15px; padding: 10px; border-radius: 8px;"></div>
        
        <p style="margin-top: 15px; font-size: 12px; color: #999;">
            🔒 Your location and device information will be recorded for security
        </p>
    </div>
</div>

<script>
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
        document.getElementById('locationStatus').innerHTML = '📍 Location detected ✓';
        document.getElementById('locationStatus').style.background = '#d4edda';
        document.getElementById('locationStatus').style.color = '#155724';
    }, function(error) {
        let message = '';
        switch(error.code) {
            case error.PERMISSION_DENIED:
                message = '⚠️ Location access denied. Please enable GPS for accurate marking.';
                break;
            case error.POSITION_UNAVAILABLE:
                message = '⚠️ Location information unavailable.';
                break;
            case error.TIMEOUT:
                message = '⚠️ Location request timed out.';
                break;
        }
        document.getElementById('locationStatus').innerHTML = message;
        document.getElementById('locationStatus').style.background = '#fff3cd';
        document.getElementById('locationStatus').style.color = '#856404';
    });
} else {
    document.getElementById('locationStatus').innerHTML = '❌ Geolocation not supported by your browser';
    document.getElementById('locationStatus').style.background = '#f8d7da';
    document.getElementById('locationStatus').style.color = '#721c24';
}

function onScanSuccess(decodedText) {
    try {
        let url = new URL(decodedText);
        let session = url.searchParams.get("session_id");
        document.getElementById("session_id").value = session;
        scanner.clear();
        document.getElementById('attendanceForm').submit();
    } catch(e) {
        document.getElementById("session_id").value = decodedText;
        scanner.clear();
        document.getElementById('attendanceForm').submit();
    }
}

let scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 });
scanner.render(onScanSuccess);
</script>

<script>
    // Mobile Menu Functions
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const menuBtn = document.querySelector('.menu-toggle');
        if (sidebar) {
            sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
            if (menuBtn) menuBtn.classList.toggle('open');
        }
    }
    function closeSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const menuBtn = document.querySelector('.menu-toggle');
        if (sidebar) {
            sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
            if (menuBtn) menuBtn.classList.remove('open');
        }
    }
    document.querySelectorAll('.sidebar a').forEach(link => {
        link.addEventListener('click', () => { if (window.innerWidth <= 768) closeSidebar(); });
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && window.innerWidth <= 768) closeSidebar(); });
    window.addEventListener('resize', () => { if (window.innerWidth > 768) closeSidebar(); });
</script>
</body>

</html>
