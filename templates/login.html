<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
    .login-card {
        max-width: 400px;
        margin: 0 auto;
    }
    
    /* Tab Style Role Selection */
    .role-tabs {
        display: flex;
        background: #f0f2f5;
        border-radius: 50px;
        padding: 5px;
        margin: 20px 0;
        gap: 5px;
    }
    
    .role-tab {
        flex: 1;
        text-align: center;
        padding: 12px 8px;
        border-radius: 40px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 600;
        font-size: 14px;
        background: transparent;
        color: #666;
        border: none;
    }
    
    .role-tab i {
        margin-right: 6px;
        font-style: normal;
    }
    
    .role-tab.active {
        background: linear-gradient(135deg, #1a3c61, #2a5298);
        color: white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    
    .role-tab.student.active {
        background: linear-gradient(135deg, #28a745, #20c997);
    }
    
    .role-tab.faculty.active {
        background: linear-gradient(135deg, #17a2b8, #0dcaf0);
    }
    
    .role-tab.admin.active {
        background: linear-gradient(135deg, #dc3545, #c82333);
    }
    
    .role-tab:hover:not(.active) {
        background: #e0e0e0;
        transform: translateY(-2px);
    }
    
    @media (max-width: 480px) {
        .role-tab {
            padding: 10px 5px;
            font-size: 12px;
        }
        .role-tab i {
            margin-right: 3px;
        }
    }
    
    /* Form styling */
    .input-group {
        margin-bottom: 15px;
    }
    
    .input-group input {
        width: 100%;
        padding: 14px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        font-size: 14px;
        transition: all 0.3s;
    }
    
    .input-group input:focus {
        outline: none;
        border-color: #1a3c61;
        box-shadow: 0 0 0 3px rgba(26,60,97,0.1);
    }
    
    .login-btn {
        background: linear-gradient(135deg, #1a3c61, #2a5298);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: all 0.3s;
        margin-top: 10px;
    }
    
    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    
    .demo-credentials {
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid #e0e0e0;
        font-size: 11px;
        text-align: center;
        color: #666;
    }
    
    .demo-credentials p {
        margin: 5px 0;
    }
</style>
</head>
<body>

<button class="menu-toggle" onclick="toggleSidebar()">
    <div class="hamburger-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</button>

<!-- ✅ RIGHT HERE - Right after the button -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="sidebar" id="sidebar">
    <h2>📋 Smart Attendance</h2>
    <a href="/">🏠 Home</a>
    <a href="/login">🔐 Login</a>
    <a href="/subject_details">📚 Subjects</a>
    <a href="/about">ℹ️ About</a>
</div>

<div class="main">
    <div class="header">
        🎓 Priyadarshini Bhagwati College of Engineering, Nagpur
    </div>

    <div class="card login-card">
        <h2 style="text-align: center;">🔐 Login to System</h2>
        
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            <!-- Tab Style Role Selection -->
            <div class="role-tabs">
                <button type="button" class="role-tab student active" data-role="student" onclick="selectRole('student')">
                    <i>👨‍🎓</i> Student
                </button>
                <button type="button" class="role-tab faculty" data-role="faculty" onclick="selectRole('faculty')">
                    <i>👨‍🏫</i> Faculty
                </button>
                <button type="button" class="role-tab admin" data-role="admin" onclick="selectRole('admin')">
                    <i>👑</i> Admin
                </button>
            </div>
            
            <input type="hidden" name="role" id="selectedRole" value="student">
            
            <div class="input-group">
                <input type="text" name="user_id" id="user_id" placeholder="Roll Number (e.g., CS001)" required>
            </div>
            
            <div class="input-group" id="passwordGroup" style="display: none;">
                <input type="password" name="password" id="password" placeholder="Password" autocomplete="off">
            </div>
            
            <button type="submit" class="login-btn">Login →</button>
        </form>
        
        <div class="demo-credentials">
            <p><strong>📋 Demo Credentials</strong></p>
            <p>👨‍🎓 Student: CS001 (No password) | 👨‍🏫 Faculty: FAC001 / faculty123 | 👑 Admin: ADMIN001 / admin123</p>
        </div>
    </div>
</div>

<script>
    
    function selectRole(role) {
        // Update tab active state
        document.querySelectorAll('.role-tab').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelector(`.role-tab.${role}`).classList.add('active');
        
        // Update hidden field
        document.getElementById('selectedRole').value = role;
        
        // Update form fields
        const userIdField = document.getElementById('user_id');
        const passwordGroup = document.getElementById('passwordGroup');
        const passwordField = document.getElementById('password');
        
        if (role === 'student') {
            userIdField.placeholder = 'Enter Roll Number (e.g., CS001)';
            passwordGroup.style.display = 'none';
            passwordField.required = false;
            passwordField.value = '';
        } else if (role === 'faculty') {
            userIdField.placeholder = 'Enter Faculty ID (e.g., FAC001)';
            passwordGroup.style.display = 'block';
            passwordField.placeholder = 'Password (faculty123)';
            passwordField.required = true;
        } else if (role === 'admin') {
            userIdField.placeholder = 'Enter Admin ID (ADMIN001)';
            passwordGroup.style.display = 'block';
            passwordField.placeholder = 'Password (admin123)';
            passwordField.required = true;
        }
    }
    
    // Initialize with student role
    selectRole('student');
</script>

<script>
    // Mobile Menu Functions
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const menuBtn = document.querySelector('.menu-toggle');
        if (sidebar) {
            sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
            if (menuBtn) menuBtn.classList.toggle('open');
        }
    }
    function closeSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const menuBtn = document.querySelector('.menu-toggle');
        if (sidebar) {
            sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
            if (menuBtn) menuBtn.classList.remove('open');
        }
    }
    document.querySelectorAll('.sidebar a').forEach(link => {
        link.addEventListener('click', () => { if (window.innerWidth <= 768) closeSidebar(); });
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && window.innerWidth <= 768) closeSidebar(); });
    window.addEventListener('resize', () => { if (window.innerWidth > 768) closeSidebar(); });
</script>

</body>
</html>
