<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="sidebar">
    <h2>📋 Admin Portal</h2>
    <a href="/">🏠 Home</a>
    <a href="/login">🔐 User Login</a>
</div>

<div class="main">
    <div class="header">
        🔐 Administrator Access Only
    </div>

    <div class="card" style="max-width:450px; margin:0 auto;">
        <h2 style="text-align:center;">Admin Authentication</h2>
        
        {% if error %}
        <div style="background:#f8d7da; color:#721c24; padding:10px; border-radius:8px; margin-bottom:15px;">
            ❌ {{ error }}
        </div>
        {% endif %}
        
        <form method="POST">
            <input type="password" name="admin_key" placeholder="Enter Admin Security Key" required>
            <button type="submit">Access Admin Panel →</button>
        </form>
        
        <p style="margin-top:15px; font-size:12px; color:#666; text-align:center;">
            🔒 Unauthorized access is prohibited and monitored.
        </p>
    </div>
</div>

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }
    
    // Close sidebar when clicking a link (on mobile)
    document.querySelectorAll('.sidebar a').forEach(link => {
        link.addEventListener('click', () => {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        });
    });
    
    // Close sidebar when clicking outside (on mobile)
    document.addEventListener('click', function(event) {
        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.querySelector('.menu-toggle');
        if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
            if (!sidebar.contains(event.target) && !menuToggle.contains(event.target)) {
                sidebar.classList.remove('open');
            }
        }
    });
</script>
</body>
<!-- Mobile Menu Toggle Button -->
<button class="menu-toggle" onclick="toggleSidebar()">☰ Menu</button>
</html>
