<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<button class="menu-toggle" onclick="toggleSidebar()">
    <div class="hamburger-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</button>

<!-- ✅ RIGHT HERE - Right after the button -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="sidebar" id="sidebar">
    <h2>📋 Admin Portal</h2>
    <a href="/">🏠 Home</a>
    <a href="/login">🔐 User Login</a>
</div>

<div class="main">
    <div class="header">
        🔐 Administrator Access Only
    </div>

    <div class="card" style="max-width:450px; margin:0 auto;">
        <h2 style="text-align:center;">Admin Authentication</h2>
        
        {% if error %}
        <div style="background:#f8d7da; color:#721c24; padding:10px; border-radius:8px; margin-bottom:15px;">
            ❌ {{ error }}
        </div>
        {% endif %}
        
        <form method="POST">
            <input type="password" name="admin_key" placeholder="Enter Admin Security Key" required>
            <button type="submit">Access Admin Panel →</button>
        </form>
        
        <p style="margin-top:15px; font-size:12px; color:#666; text-align:center;">
            🔒 Unauthorized access is prohibited and monitored.
        </p>
    </div>
</div>

<script>
    // Mobile Menu Functions
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const menuBtn = document.querySelector('.menu-toggle');
        if (sidebar) {
            sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
            if (menuBtn) menuBtn.classList.toggle('open');
        }
    }
    function closeSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const menuBtn = document.querySelector('.menu-toggle');
        if (sidebar) {
            sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
            if (menuBtn) menuBtn.classList.remove('open');
        }
    }
    document.querySelectorAll('.sidebar a').forEach(link => {
        link.addEventListener('click', () => { if (window.innerWidth <= 768) closeSidebar(); });
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && window.innerWidth <= 768) closeSidebar(); });
    window.addEventListener('resize', () => { if (window.innerWidth > 768) closeSidebar(); });
</script>
</body>

</html>
