<!DOCTYPE html>
<html>
<head>
<title>Create Session</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
    .subject-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 15px;
        margin: 20px 0;
    }
    .subject-card {
        background: linear-gradient(135deg, #28a745, #20c997);
        color: white;
        padding: 18px 12px;
        border-radius: 16px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        border: none;
        width: 100%;
        margin: 0;
        font-weight: 600;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .subject-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .subject-card.selected {
        background: linear-gradient(135deg, #1a3c61, #2a5298);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        transform: scale(1.02);
    }
    .subject-card small {
        font-size: 11px;
        opacity: 0.9;
    }
    .duration-select {
        margin: 25px 0;
    }
    .duration-select label {
        font-weight: 600;
        color: #1a3c61;
        display: block;
        margin-bottom: 8px;
    }
    .duration-select select {
        width: 100%;
        padding: 12px 15px;
        border-radius: 12px;
        border: 2px solid #e0e0e0;
        font-size: 14px;
        background: white;
        cursor: pointer;
    }
    .create-btn {
        background: linear-gradient(135deg, #28a745, #20c997);
        font-size: 18px;
        padding: 15px;
        margin-top: 20px;
        font-weight: bold;
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(40,167,69,0.3);
    }
    .create-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(40,167,69,0.4);
    }
    .error-msg {
        background: #f8d7da;
        color: #721c24;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 15px;
        display: none;
        border-left: 4px solid #dc3545;
    }
    .info-tip {
        background: #e8f4f8;
        padding: 12px;
        border-radius: 10px;
        text-align: center;
        margin-top: 20px;
    }
    .info-tip p {
        margin: 0;
        font-size: 13px;
        color: #1a3c61;
    }
</style>
</head>
<body>

<button class="menu-toggle" onclick="toggleSidebar()">
    <div class="hamburger-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</button>

<!-- ✅ RIGHT HERE - Right after the button -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="sidebar" id="sidebar">
    <h2>📋 Smart Attendance</h2>
    <a href="/faculty_dashboard">📊 Dashboard</a>
    <a href="/create_session">➕ Create Session</a>
    <a href="/add_student">👥 Manage Students</a>
    <a href="/students_report">📑 Reports</a>
    <a href="/attendance">📜 All Attendance</a>
    <a href="/subject_details">📚 Subjects</a>
    <a href="/about">ℹ️ About</a>
    <a href="/logout">🚪 Logout</a>
</div>

<div class="main">
    <div class="header" style="background: linear-gradient(135deg, #28a745, #20c997);">
        ➕ Create New Attendance Session
    </div>

    <div class="card">
        <h2>📝 Session Details</h2>
        
        <div id="errorMsg" class="error-msg">
            ⚠️ Please select a subject before creating session
        </div>
        
        <form method="POST" action="/create_session" id="sessionForm">
            <label>📚 Select Subject:</label>
            <div class="subject-grid">
                <button type="submit" name="subject" value="ML" class="subject-card" onclick="selectSubject(this, 'ML')">
                    🤖 Machine Learning<br><small>(ML)</small>
                </button>
                <button type="submit" name="subject" value="DS" class="subject-card" onclick="selectSubject(this, 'DS')">
                    🗃️ Data Structures<br><small>(DS)</small>
                </button>
                <button type="submit" name="subject" value="CD" class="subject-card" onclick="selectSubject(this, 'CD')">
                    ⚙️ Compiler Design<br><small>(CD)</small>
                </button>
                <button type="submit" name="subject" value="IPR" class="subject-card" onclick="selectSubject(this, 'IPR')">
                    📜 IPR<br><small>(IPR)</small>
                </button>
                <button type="submit" name="subject" value="EOII" class="subject-card" onclick="selectSubject(this, 'EOII')">
                    📈 Economics in IT<br><small>(EOII)</small>
                </button>
                <button type="submit" name="subject" value="OE-1" class="subject-card" onclick="selectSubject(this, 'OE-1')">
                    🌍 Environmental Engg<br><small>(OE-1)</small>
                </button>
            </div>
            
            <div class="duration-select">
                <label>⏱️ Session Duration:</label>
                <select name="duration" required>
                    <option value="1">1 minute (Quick Session)</option>
                    <option value="2">2 minutes</option>
                    <option value="5" selected>5 minutes (Standard)</option>
                    <option value="10">10 minutes</option>
                    <option value="15">15 minutes (Lecture)</option>
                    <option value="30">30 minutes (Long Session)</option>
                </select>
            </div>
            
            <input type="hidden" name="selected_subject" id="selected_subject" value="">
            
            <button type="button" class="create-btn" onclick="submitSession()">🚀 Generate QR Code</button>
        </form>
        
        <div class="info-tip">
            <p>💡 Tip: Select a subject first, then click "Generate QR Code"</p>
        </div>
    </div>
</div>

<script>
    let currentSubject = null;
    
    function selectSubject(button, subject) {
        // Remove selected class from all buttons
        document.querySelectorAll('.subject-card').forEach(btn => {
            btn.classList.remove('selected');
        });
        
        // Add selected class to clicked button
        button.classList.add('selected');
        
        // Store selected subject
        currentSubject = subject;
        document.getElementById('selected_subject').value = subject;
        
        // Hide error message
        document.getElementById('errorMsg').style.display = 'none';
    }
    
    function submitSession() {
        if (!currentSubject) {
            document.getElementById('errorMsg').style.display = 'block';
            return;
        }
        
        // Create form data and submit
        const form = document.getElementById('sessionForm');
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'hidden';
        hiddenInput.name = 'subject';
        hiddenInput.value = currentSubject;
        form.appendChild(hiddenInput);
        form.submit();
    }
    
</script>

<script>
    // Mobile Menu Functions
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const menuBtn = document.querySelector('.menu-toggle');
        if (sidebar) {
            sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('active');
            if (menuBtn) menuBtn.classList.toggle('open');
        }
    }
    function closeSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const menuBtn = document.querySelector('.menu-toggle');
        if (sidebar) {
            sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
            if (menuBtn) menuBtn.classList.remove('open');
        }
    }
    document.querySelectorAll('.sidebar a').forEach(link => {
        link.addEventListener('click', () => { if (window.innerWidth <= 768) closeSidebar(); });
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && window.innerWidth <= 768) closeSidebar(); });
    window.addEventListener('resize', () => { if (window.innerWidth > 768) closeSidebar(); });
</script>

</body>
</html>
