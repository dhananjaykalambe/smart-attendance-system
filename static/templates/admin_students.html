<!DOCTYPE html>
<html>
<head>
<title>Admin - Manage Students</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="sidebar">
    <h2>👑 Admin Panel</h2>
    <a href="/admin/faculty">👥 Manage Faculty</a>
    <a href="/admin/students">👨‍🎓 Manage Students</a>
    <a href="/admin/sessions">📊 View All Sessions</a>
    <a href="/admin/logout">🚪 Admin Logout</a>
    <hr style="margin:15px 0;">
    <a href="/faculty_dashboard">📊 Dashboard</a>
    <a href="/">🏠 Home</a>
</div>

<div class="main">
    <div class="header" style="background:linear-gradient(135deg,#dc3545,#c82333);">
        👨‍🎓 Student Management
    </div>

    <div class="card">
        <h2>➕ Add New Student</h2>
        <form method="POST" action="/admin/add_student">
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:15px;">
                <input type="text" name="roll_no" placeholder="Roll Number (e.g., CS011)" required>
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="text" name="branch" placeholder="Branch" required>
            </div>
            <button type="submit" style="background:#28a745;">➕ Add Student</button>
        </form>
    </div>

    <div class="card">
        <h2>📋 All Students</h2>
        <div style="overflow-x:auto;">
            <table>
                <tr style="background:#1a3c61; color:white;">
                    <th>Roll No</th><th>Name</th><th>Branch</th><th>Action</th>
                </tr>
                {% for student in students %}
                <tr>
                    <td>{{ student.roll_no }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.branch }}</td>
                    <td>
                        <a href="/admin/delete_student/{{ student.roll_no }}" 
                           onclick="return confirm('Delete this student?')">
                            <button class="danger" style="background:#dc3545;">Delete</button>
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>
</div>

</body>
</html>
